name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add permissions to AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS WAKE_LOCK VIBRATE USE_FULL_SCREEN_INTENT SCHEDULE_EXACT_ALARM; do
            sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$M"
          done
          cat "$M"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk wake-up-travel-alarm.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wake-up-travel-alarm
          path: wake-up-travel-alarm.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wake-up-travel-alarm.apk
